# ╔══════════════════════════════════════════════════════════════╗
# ║              ByteBank — Pipeline GitLab CI                  ║
# ╚══════════════════════════════════════════════════════════════╝

stages:
  - install
  - test
  - build
  - package
  - deploy
  - notify

# ──────────────────────────────────────────────────────────────
# STAGE 1 — INSTALAÇÃO DE DEPENDÊNCIAS
# ──────────────────────────────────────────────────────────────

install-backend:
  stage: install
  image: python:3.11-slim
  script:
    - echo "📦 Instalando dependências do Backend..."
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install pytest pytest-cov flask-cors
    - echo "✅ Dependências do Backend instaladas com sucesso."
  cache:
    key: backend-deps-$CI_COMMIT_REF_SLUG
    paths:
      - .pip-cache/

install-frontend:
  stage: install
  image: node:20-slim
  script:
    - echo "📦 Instalando dependências do Frontend..."
    - cd Frontend
    - npm ci
    - echo "✅ Dependências do Frontend instaladas com sucesso."
  cache:
    key: frontend-deps-$CI_COMMIT_REF_SLUG
    paths:
      - Frontend/node_modules/

# ──────────────────────────────────────────────────────────────
# STAGE 2 — TESTES
# ──────────────────────────────────────────────────────────────

backend-tests:
  stage: test
  image: python:3.11-slim
  before_script:
    - echo "🧪 Preparando ambiente de testes do Backend..."
    - pip install --upgrade pip -q
    - pip install -r requirements.txt -q
    - pip install pytest pytest-cov flask-cors -q
  script:
    - echo "▶ Executando testes unitários do Backend (pytest)..."
    - cd Backend
    - PYTHONPATH=. python -m pytest app/testes/test_funcoes.py -v --tb=short
        --junitxml=report-backend.xml
        --cov=app --cov-report=term-missing --cov-report=xml:coverage-backend.xml
    - echo "✅ Testes do Backend concluídos."
  artifacts:
    when: always
    reports:
      junit: Backend/report-backend.xml
      coverage_report:
        coverage_format: cobertura
        path: Backend/coverage-backend.xml
    paths:
      - Backend/report-backend.xml
      - Backend/coverage-backend.xml
    expire_in: 14 days
  coverage: '/TOTAL.*\s+(\d+%)$/'

frontend-lint:
  stage: test
  image: node:20-slim
  before_script:
    - echo "🔍 Preparando lint do Frontend..."
    - cd Frontend
    - npm ci --silent
  script:
    - echo "▶ Executando ESLint..."
    - npm run lint
    - echo "✅ Lint do Frontend sem erros."
  allow_failure: false

frontend-tests:
  stage: test
  image: node:20-slim
  before_script:
    - echo "🧪 Preparando testes do Frontend..."
    - cd Frontend
    - npm ci --silent
  script:
    - echo "▶ Executando testes do Frontend (vitest)..."
    - npm test -- --run --reporter=verbose --reporter=junit --outputFile=report-frontend.xml
    - echo "✅ Testes do Frontend concluídos."
  artifacts:
    when: always
    reports:
      junit: Frontend/report-frontend.xml
    paths:
      - Frontend/report-frontend.xml
    expire_in: 14 days

# ──────────────────────────────────────────────────────────────
# STAGE 3 — BUILD / VALIDAÇÃO
# ──────────────────────────────────────────────────────────────

frontend-build:
  stage: build
  image: node:20-slim
  before_script:
    - echo "🏗️  Preparando build do Frontend..."
    - cd Frontend
    - npm ci --silent
  script:
    - echo "▶ Executando build de produção (vite build)..."
    - npm run build
    - echo "✅ Build do Frontend gerado com sucesso em Frontend/dist/"
  artifacts:
    when: on_success
    paths:
      - Frontend/dist/
    expire_in: 14 days

backend-validate:
  stage: build
  image: python:3.11-slim
  before_script:
    - pip install --upgrade pip -q
    - pip install -r requirements.txt -q
    - pip install flask-cors -q
  script:
    - echo "▶ Validando inicialização do Backend (Flask)..."
    - python -c "from Backend.app import create_app; app = create_app(); print('✅ Backend inicializado com sucesso.')"
  allow_failure: true

# ──────────────────────────────────────────────────────────────
# STAGE 4 — EMPACOTAMENTO / ARTEFATOS
# ──────────────────────────────────────────────────────────────

package-backend:
  stage: package
  image: python:3.11-slim
  before_script:
    - pip install --upgrade pip -q
    - pip install build wheel -q
  script:
    - echo "📦 Empacotando Backend..."
    - mkdir -p dist-backend
    - cp -r Backend dist-backend/
    - cp requirements.txt dist-backend/
    - cp run.py dist-backend/
    - tar -czf bytebank-backend-$CI_COMMIT_SHORT_SHA.tar.gz dist-backend/
    - echo "✅ Pacote do Backend gerado bytebank-backend-$CI_COMMIT_SHORT_SHA.tar.gz"
  artifacts:
    when: on_success
    paths:
      - bytebank-backend-*.tar.gz
    expire_in: 14 days

package-frontend:
  stage: package
  image: node:20-slim
  dependencies:
    - frontend-build
  script:
    - echo "📦 Empacotando Frontend (dist)..."
    - tar -czf bytebank-frontend-$CI_COMMIT_SHORT_SHA.tar.gz Frontend/dist/
    - echo "✅ Pacote do Frontend gerado bytebank-frontend-$CI_COMMIT_SHORT_SHA.tar.gz"
  artifacts:
    when: on_success
    paths:
      - bytebank-frontend-*.tar.gz
    expire_in: 14 days

# ──────────────────────────────────────────────────────────────
# STAGE 5 — SIMULAÇÃO DE DEPLOY
# ──────────────────────────────────────────────────────────────

deploy-simulation:
  stage: deploy
  image: alpine:latest
  dependencies:
    - package-backend
    - package-frontend
  script:
    - echo " Iniciando simulação de deploy do ByteBank..."
    - echo "──────────────────────────────────────────"
    - 'echo "Branch - $CI_COMMIT_REF_NAME"'
    - 'echo "Commit - $CI_COMMIT_SHORT_SHA"'
    - 'echo "Pipeline - $CI_PIPELINE_ID"'
    - 'echo "Autor - $CI_COMMIT_AUTHOR"'
    - echo "──────────────────────────────────────────"
    - echo "▶ [1/4] Verificando pacotes gerados..."
    - ls -lh bytebank-backend-*.tar.gz bytebank-frontend-*.tar.gz
    - echo "▶ [2/4] Simulando extração dos pacotes no servidor..."
    - mkdir -p /tmp/deploy/backend /tmp/deploy/frontend
    - tar -xzf bytebank-backend-*.tar.gz -C /tmp/deploy/backend
    - tar -xzf bytebank-frontend-*.tar.gz -C /tmp/deploy/frontend
    - echo "▶ [3/4] Simulando configuração de variáveis de ambiente..."
    - echo "  FLASK_ENV=production"
    - echo "  MONGO_URI=<configurado via variável secreta>"
    - echo "  SECRET_KEY=<configurado via variável secreta>"
    - echo "▶ [4/4] Simulação de deploy concluída."
    - echo " ByteBank estaria disponível em https://bytebank.example.com"
  environment:
    name: staging
    url: https://bytebank.example.com
  only:
    - main

# ──────────────────────────────────────────────────────────────
# STAGE 6 — NOTIFICAÇÕES DE STATUS
# ──────────────────────────────────────────────────────────────

